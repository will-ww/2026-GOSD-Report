<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530"><rect x="0" y="0" width="1000" height="530" fill="#FFFFFF" opacity="1"/><text x="282" y="27" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#487B88" text-anchor="middle">社区视角 · 项目内部</text><text x="751" y="27" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#426B9B" text-anchor="middle">全域视角 · 跨项目网络</text><rect x="78" y="48" width="423" height="211" fill="#F0F6F7" opacity="1"/><rect x="518" y="48" width="482" height="211" fill="#EEF3F9" opacity="1"/><rect x="78" y="276" width="423" height="211" fill="#F6F7F8" opacity="1"/><rect x="518" y="276" width="482" height="211" fill="#EEF3F9" opacity="1"/><text x="0" y="105" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#19314A" text-anchor="start">开发者</text><text x="0" y="333" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#19314A" text-anchor="start">仓库</text><text x="0" y="364" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#19314A" text-anchor="start">／项目</text><text x="103" y="84" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#487B88" text-anchor="start">社区 OpenRank 贡献度</text><text x="103" y="116" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#19314A" text-anchor="start">参与者在项目协作网络中的相对贡献</text><path d="M132.000,164.000 L204.000,211.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M132.000,164.000 L357.000,209.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M204.000,211.000 L272.000,155.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M272.000,155.000 L357.000,209.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M357.000,209.000 L446.000,163.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M204.000,211.000 L446.000,163.000" fill="none" stroke="#8BAEBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="132" cy="164" r="10" fill="#487B88" stroke="#487B88" stroke-width="1.3"/><rect x="193" y="200" width="22" height="22" fill="#487B88" opacity="1"/><circle cx="272" cy="155" r="10" fill="#487B88" stroke="#487B88" stroke-width="1.3"/><rect x="346" y="198" width="22" height="22" fill="#487B88" opacity="1"/><circle cx="446" cy="163" r="10" fill="#487B88" stroke="#487B88" stroke-width="1.3"/><text x="103" y="245" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#667785" text-anchor="start">圆点：开发者；方点：Issue / PR（示意）</text><text x="543" y="84" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#426B9B" text-anchor="start">开发者全域 OpenRank 影响力</text><text x="543" y="118" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#19314A" text-anchor="start">从开发者与仓库的协作关系，观察跨项目的连接位置</text><text x="543" y="146" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#19314A" text-anchor="start">及长期积累。</text><text x="543" y="209" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#426B9B" text-anchor="start">个人／群体 → 组织或地域聚合</text><text x="543" y="244" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#667785" text-anchor="start">合计时明确身份、观察范围与时期</text><text x="103" y="317" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#487B88" text-anchor="start">过程与影响，提供不同视角</text><text x="103" y="354" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#19314A" text-anchor="start">议题、评审与合入记录说明项目怎样协作；</text><text x="103" y="384" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#19314A" text-anchor="start">右侧的项目影响力说明它在更大网络中的位</text><text x="103" y="414" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#19314A" text-anchor="start">置。</text><text x="543" y="317" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#426B9B" text-anchor="start">仓库／项目全域 OpenRank 影响力</text><text x="543" y="354" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#19314A" text-anchor="start">在同一协作网络中，观察仓库或项目与开发者之间</text><text x="543" y="384" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#19314A" text-anchor="start">的相互连接。</text><text x="543" y="445" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#426B9B" text-anchor="start">组织／国家地区／技术生态</text><text x="543" y="475" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#667785" text-anchor="start">按明确名录和归属关系形成观察单元</text><text x="78" y="519" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#667785" text-anchor="start">分类关系示意；项目内部贡献与跨项目影响分别理解。</text></svg>