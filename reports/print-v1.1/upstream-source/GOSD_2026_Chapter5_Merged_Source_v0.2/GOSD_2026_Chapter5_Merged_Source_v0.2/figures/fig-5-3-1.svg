<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805"><rect x="0" y="0" width="1000" height="805" fill="#FFFFFF" opacity="1"/><rect x="0" y="0" width="1000" height="69" fill="#F3F7F9" opacity="1"/><text x="18" y="30" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#007D78" text-anchor="start">先确认一个具体模型版本，再分别问两个问题</text><text x="18" y="55" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">材料是否足够？使用权利是否明确？两条轴独立记录，不合成为一个总分。</text><circle cx="12" cy="97" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="103" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="33" y="104" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">完整性 L：再创造能走到哪一步</text><circle cx="662" cy="97" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="662" y="103" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="683" y="104" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">开放性 O：允许怎样使用</text><path d="M625.000,87.000 L625.000,550.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="14" y="134" width="576" height="67" fill="#F3F7F9" opacity="1"/><rect x="14" y="134" width="50" height="67" fill="#155fa8" opacity="1"/><text x="39" y="173" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">L1</text><text x="78" y="162" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#155fa8" text-anchor="start">能部署</text><text x="258" y="159" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">权重、配置、分词器</text><text x="258" y="184" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">推理脚本与运行环境</text><rect x="26" y="210" width="564" height="67" fill="#F3F7F9" opacity="1"/><rect x="26" y="210" width="50" height="67" fill="#10669c" opacity="1"/><text x="51" y="249" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">L2</text><text x="90" y="238" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#10669c" text-anchor="start">能理解</text><text x="258" y="235" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">模型原理、训练过程</text><text x="258" y="260" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">测试结果与已知局限</text><rect x="38" y="286" width="552" height="67" fill="#F3F7F9" opacity="1"/><rect x="38" y="286" width="50" height="67" fill="#0a6e90" opacity="1"/><text x="63" y="325" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">L3</text><text x="102" y="314" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#0a6e90" text-anchor="start">能再训练</text><text x="258" y="311" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">训练代码、环境、数据</text><text x="258" y="336" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">或完整来源与处理规则</text><rect x="50" y="362" width="540" height="67" fill="#F3F7F9" opacity="1"/><rect x="50" y="362" width="50" height="67" fill="#057684" opacity="1"/><text x="75" y="401" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text><text x="114" y="390" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#057684" text-anchor="start">能验证</text><text x="258" y="387" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">测试代码、数据与环境</text><text x="258" y="412" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">训练／测试无重叠说明</text><rect x="62" y="438" width="528" height="67" fill="#F3F7F9" opacity="1"/><rect x="62" y="438" width="50" height="67" fill="#007d78" opacity="1"/><text x="87" y="477" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">L5</text><text x="126" y="466" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#007d78" text-anchor="start">能全链复现</text><text x="258" y="463" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">清洗与处理脚本、数据配方</text><text x="258" y="488" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">从数据准备到部署的复现指引</text><text x="15" y="545" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#5C6B7A" text-anchor="start">逐级累积：高等级包含此前各级要求；仍须运行验证。</text><circle cx="673" cy="144" r="21" fill="#155fa8" stroke="#155fa8" stroke-width="1.3"/><text x="673" y="151" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">O1</text><text x="710" y="151" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">有限制开放</text><text x="651" y="182" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">核对用途、商业化与再分发限制。</text><circle cx="673" cy="232" r="21" fill="#0e6998" stroke="#0e6998" stroke-width="1.3"/><text x="673" y="239" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">O2</text><text x="710" y="239" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">互惠开放</text><text x="651" y="270" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">衍生再分发须延续相同或兼容许可。</text><circle cx="673" cy="320" r="21" fill="#077388" stroke="#077388" stroke-width="1.3"/><text x="673" y="327" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">O3</text><text x="710" y="327" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">宽松开放</text><text x="651" y="358" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">广泛授权，保留署名与许可等义务。</text><circle cx="673" cy="408" r="21" fill="#007d78" stroke="#007d78" stroke-width="1.3"/><text x="673" y="415" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">O4</text><text x="710" y="415" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">零义务开放</text><text x="651" y="446" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">无额外合同义务；法定义务仍适用。</text><rect x="646" y="491" width="354" height="54" fill="#F3F7F9" opacity="1"/><text x="657" y="514" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#5C6B7A" text-anchor="start">核心许可不能核实，应标待核；不能自动降为 </text><text x="657" y="537" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#5C6B7A" text-anchor="start">O1。</text><path d="M0.000,569.000 L1000.000,569.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="599" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="605" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="606" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">怎样读出一个版本的开放条件</text><circle cx="537" cy="599" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="537" y="605" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="558" y="606" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="start">怎样将公开材料变成可用能力</text><text x="0" y="654" font-family="Noto Sans CJK SC" font-size="38" font-weight="700" fill="#155FA8" text-anchor="start">L2 + O3</text><text x="232" y="652" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">示意组合</text><text x="0" y="694" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">能够部署并理解，许可较宽松；仍不能据此认定训练与全链</text><text x="0" y="717" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">复现材料已经齐备。</text><text x="0" y="774" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#5C6B7A" text-anchor="start">比较分组：高完整 L3—L5；高开放 O2—O4</text><circle cx="540" cy="644" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="540" y="650" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="563" y="649" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#007D78" text-anchor="start">查材料</text><text x="650" y="649" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">逐条记录版本与出处</text><circle cx="540" cy="692" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="540" y="698" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="563" y="697" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#007D78" text-anchor="start">跑验证</text><text x="650" y="697" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">按公开环境完成规定验证</text><circle cx="540" cy="740" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="540" y="746" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="563" y="745" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#007D78" text-anchor="start">查许可</text><text x="650" y="745" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">对相应材料逐项比对权利</text></svg>