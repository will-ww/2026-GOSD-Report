 SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">提供模型和使用示例</text><path d="M523.000,435.000 L990.000,435.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="523" y="465" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">训练工具</text><text x="628" y="465" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#AD4E22" text-anchor="start">verl</text><text x="628" y="490" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">支持模型训练与改进</text><path d="M523.000,500.000 L990.000,500.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="523" y="530" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">计算软件</text><text x="628" y="530" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#AD4E22" text-anchor="start">CANN / torch_npu</text><text x="628" y="555" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">帮助模型软件使用计算设备</text><path d="M523.000,565.000 L990.000,565.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="523" y="604" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">以上是功能举例，不表示这些项目全部互联。</text></svg>