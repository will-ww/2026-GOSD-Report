="25" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">中国模型被海外团队继续使用</text><text x="523" y="55" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">可识别跨国关系样本：10,943 对</text><text x="523" y="105" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#AD4E22" text-anchor="start">中国模型 → 美国发布的后续版本</text><text x="523" y="161" font-family="Noto Sans CJK SC" font-size="45" font-weight="700" fill="#AD4E22" text-anchor="start">4,639</text><text x="686" y="159" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" fill="#AD4E22" text-anchor="start">对</text><text x="986" y="161" font-family="Noto Sans CJK SC" font-size="36" font-weight="700" fill="#AD4E22" text-anchor="end">42.4%</text><rect x="523" y="180" width="197.9724938316732" height="28" fill="#AD4E22" opacity="1"/><rect x="720.9724938316732" y="180" width="269.0275061683268" height="28" fill="#B9C2CD" opacity="1"/><text x="523" y="239" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">已有模型的来源地：中国占 53.8%；</text><text x="523" y="262" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">后续版本的发布地：美国占 68.7%。</text><text x="523" y="295" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">按发布主体地域统计；非全球完整记录。</text><circle cx="12" cy="340" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="346" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="347" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">CANN 组织多个仓库共同开发</text><text x="0" y="377" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">昇腾计算软件 · 参与账号，已剔除机器人</text><text x="0" y="427" font-family="Noto Sans CJK SC" font-size="