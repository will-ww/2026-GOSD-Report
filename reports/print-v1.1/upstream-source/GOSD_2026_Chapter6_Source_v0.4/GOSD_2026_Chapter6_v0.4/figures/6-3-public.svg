-weight="400" fill="#5C6B7A" text-anchor="middle">其他权限等级</text><text x="523" y="137" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#13253D" text-anchor="start">材料较完整</text><text x="523" y="199" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">其他材料</text><text x="523" y="222" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="start">等级</text><rect x="683" y="105" width="149" height="64" fill="#007D78" opacity="1"/><text x="757.5" y="148" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">117</text><rect x="845" y="105" width="149" height="64" fill="#93B2D0" opacity="1"/><text x="919.5" y="148" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">58</text><rect x="683" y="180" width="149" height="64" fill="#6B55A4" opacity="1"/><text x="757.5" y="223" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">500</text><rect x="845" y="180" width="149" height="64" fill="#B9C2CD" opacity="1"/><text x="919.5" y="223" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">214</text><text x="523" y="272" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">较完整：材料支持训练及后续环节；较开放：使用和再次分发</text><text x="523" y="295" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">的权限较宽。</text><circle cx="12" cy="340" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="346" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="347" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">补齐材料，才能帮助更多人使用</text><text x="0" y="399" font-family="Noto Sans CJK SC" font-size="43" font-weight="700" fill="#6B55A4" text-anchor="start">19.0%</text><text x="178" y="393" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#13253D" text-anchor="start">权限较开放的记录中</text><text x="178" y="421" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#13253D" text-anchor="start">材料也较完整的比例</text><text x="0" y="453" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">117 / 617；其余 500 条未达到材料较完整等级。</text><rect x="0" y="479" width="228" height="49" fill="#F3F0F8" opacity="1"/><text x="10" y="499" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#6B55A4" text-anchor="start">成本</text><text x="10" y="521" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">能持续负担</text><rect x="245" y="479" width="228" height="49" fill="#F3F0F8" opacity="1"/><text x="255" y="499" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#6B55A4" text-anchor="start">本地化</text><text x="255" y="521" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">适合语言与场景</text><rect x="0" y="538" width="228" height="49" fill="#F3F0F8" opacity="1"/><text x="10" y="558" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#6B55A4" text-anchor="start">维护</text><text x="10" y="580" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">有人负责与交接</text><rect x="245" y="538" width="228" height="49" fill="#F3F0F8" opacity="1"/><text x="255" y="558" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#6B55A4" text-anchor="start">结果</text><text x="255" y="580" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#13253D" text-anchor="start">人们能够实际受益</text><circle cx="535" cy="340" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="535" y="346" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="556" y="347" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">基金会支持共同使用的设施</text><rect x="523" y="379" width="57" height="38" fill="#F3F0F8" opacity="1"/><text x="551.5" y="405" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#6B55A4" text-anchor="middle">投入</text><text x="593" y="401" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">云资源或资金 → 共同测试与设施</text><rect x="523" y="440" width="57" height="38" fill="#F3F0F8" opacity="1"/><text x="551.5" y="466" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#6B55A4" text-anchor="middle">服务</text><text x="593" y="462" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">技术支持人员 → 提供持续帮助</text><rect x="523" y="501" width="57" height="38" fill="#F3F0F8" opacity="1"/><text x="551.5" y="527" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#6B55A4" text-anchor="middle">责任</text><text x="593" y="523" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">项目维护者 → 技术评审与决策</text><text x="523" y="585" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">以 PyTorch 机制为例；各地成本、服务效果和全球南方受益</text><text x="523" y="608" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">规模仍需另行评估。</text></svg>