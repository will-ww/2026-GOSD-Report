<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="700" fill="#FFFFFF" opacity="1"/><circle cx="12" cy="20" r="12" fill="#155FA8" stroke="#155FA8" stroke-width="1.3"/><text x="12" y="26" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="33" y="27" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">人和组织，围绕项目形成协作</text><text x="1000" y="60" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5C6B7A" text-anchor="end">地方语言公共服务助手 · 机制示例</text><rect x="0" y="89" width="299" height="172" fill="#EEF4FA" opacity="1"/><rect x="0" y="89" width="4" height="172" fill="#155FA8" opacity="1"/><text x="16" y="122" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#155FA8" text-anchor="start">人才</text><text x="16" y="156" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">研究者、工程师、本地用户</text><text x="16" y="183" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">提出需求、编写与测试</text><text x="16" y="210" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">翻译、反馈并持续改进</text><rect x="701" y="89" width="299" height="172" fill="#F3F0F8" opacity="1"/><rect x="701" y="89" width="4" height="172" fill="#68509B" opacity="1"/><text x="717" y="122" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#68509B" text-anchor="start">组织</text><text x="717" y="156" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">高校、企业、基金会等</text><text x="717" y="183" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">提供人员、资源与规则</text><text x="717" y="210" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">承担相应的维护责任</text><rect x="366" y="140" width="268" height="114" fill="#EDF6F5" opacity="1"/><rect x="366" y="140" width="268" height="5" fill="#007D78" opacity="1"/><text x="500" y="178" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#007D78" text-anchor="middle">项目</text><text x="500" y="216" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#13253D" text-anchor="middle">地方语言公共服务助手</text><path d="M307.000,197.000 L359.000,197.000" fill="none" stroke="#155FA8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M351.979,200.835 L359.000,197.000 L351.979,193.165" fill="none" stroke="#155FA8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M693.000,197.000 L641.000,197.000" fill="none" stroke="#68509B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M648.021,193.165 L641.000,197.000 L648.021,200.835" fill="none" stroke="#68509B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="332" y="175" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="middle">参与</text><text x="668" y="175" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="middle">支持</text><text x="500" y="290" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="middle">人员可以跨组织参与；组织与项目也可能是多对多关系。</text><path d="M0.000,313.000 L1000.000,313.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="341" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="347" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="33" y="348" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">项目组织、维护或引用代码、模型与数据</text><rect x="0" y="373" width="314" height="166" fill="#EEF4FA" opacity="1"/><rect x="0" y="373" width="4" height="166" fill="#155FA8" opacity="1"/><text x="16" y="406" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#155FA8" text-anchor="start">代码</text><text x="16" y="440" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">服务接口、工具与测试</text><text x="16" y="467" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">通常以仓库和版本承载</text><text x="16" y="494" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">回答：怎样实现与运行？</text><rect x="343" y="373" width="314" height="166" fill="#EDF6F5" opacity="1"/><rect x="343" y="373" width="4" height="166" fill="#007D78" opacity="1"/><text x="359" y="406" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#007D78" text-anchor="start">模型</text><text x="359" y="440" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">通用或领域模型</text><text x="359" y="467" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">包含参数、配置等材料</text><text x="359" y="494" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">回答：提供什么推理能力？</text><rect x="686" y="373" width="314" height="166" fill="#FAF4E8" opacity="1"/><rect x="686" y="373" width="4" height="166" fill="#AD6D25" opacity="1"/><text x="702" y="406" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#AD6D25" text-anchor="start">数据</text><text x="702" y="440" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">本地语料、知识与测试集</text><text x="702" y="467" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">按数据集及版本组织</text><text x="702" y="494" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">回答：用什么训练与验证？</text><text x="0" y="570" font-family="Noto Sans CJK SC" font-size="17.5" font-weight="400" fill="#5C6B7A" text-anchor="start">使用关系需要单独记录；被项目引用的模型或数据，不一定由该项目发布。</text><path d="M0.000,588.000 L1000.000,588.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="615" r="12" fill="#68509B" stroke="#68509B" stroke-width="1.3"/><text x="12" y="621" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="622" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">统计前先辨认单位，避免重复和误归属</text><text x="0" y="659" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">项目 ≠ 仓库</text><text x="0" y="690" font-family="Noto Sans CJK SC" font-size="17.5" font-weight="400" fill="#5C6B7A" text-anchor="start">一个项目可含多个仓库</text><text x="343" y="659" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">模型 ≠ 模型版本</text><text x="343" y="690" font-family="Noto Sans CJK SC" font-size="17.5" font-weight="400" fill="#5C6B7A" text-anchor="start">更新版本不一定新增模型</text><text x="686" y="659" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#13253D" text-anchor="start">组织所在地 ≠ 使用地</text><text x="686" y="690" font-family="Noto Sans CJK SC" font-size="17.5" font-weight="400" fill="#5C6B7A" text-anchor="start">总部标签不覆盖全部参与者</text></svg>