<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="700" fill="#FFFFFF" opacity="1"/><circle cx="12" cy="20" r="12" fill="#155FA8" stroke="#155FA8" stroke-width="1.3"/><text x="12" y="26" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="33" y="27" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">四个视角，围绕同一个实施问题取证</text><rect x="0" y="51" width="1000" height="59" fill="#EEF4FA" opacity="1"/><text x="500" y="88" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#155FA8" text-anchor="middle">示例问题：地方机构能否持续提供适合本地语言的 AI 服务？</text><text x="0" y="144" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#5C6B7A" text-anchor="start">章节与视角</text><text x="263" y="144" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#5C6B7A" text-anchor="start">从正文寻找的证据</text><text x="677" y="144" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#5C6B7A" text-anchor="start">进入实施前还需核对</text><rect x="0" y="162" width="1000" height="63" fill="#EEF4FA" opacity="1"/><rect x="0" y="162" width="4" height="63" fill="#155FA8" opacity="1"/><text x="16" y="187" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#155FA8" text-anchor="start">第二章</text><text x="16" y="212" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#155FA8" text-anchor="start">生态观测 GOSO</text><text x="263" y="200" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#13253D" text-anchor="start">参与者、供给、贡献与行业分布</text><text x="677" y="200" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">本地团队是否具备适配能力</text><rect x="0" y="235" width="1000" height="63" fill="#F3F0F8" opacity="1"/><rect x="0" y="235" width="4" height="63" fill="#68509B" opacity="1"/><text x="16" y="260" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#68509B" text-anchor="start">第三章</text><text x="16" y="285" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#68509B" text-anchor="start">主体与影响 GOSR</text><text x="263" y="273" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#13253D" text-anchor="start">地区、企业、基金会等协作位置</text><text x="677" y="273" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">谁能承接长期维护与合作</text><rect x="0" y="308" width="1000" height="63" fill="#EDF6F5" opacity="1"/><rect x="0" y="308" width="4" height="63" fill="#007D78" opacity="1"/><text x="16" y="333" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#007D78" text-anchor="start">第四章</text><text x="16" y="358" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#007D78" text-anchor="start">技术生态 GOSL</text><text x="263" y="346" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#13253D" text-anchor="start">模型运行、数据与工具的技术组合</text><text x="677" y="346" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">硬件、依赖与运行成本是否匹配</text><rect x="0" y="381" width="1000" height="63" fill="#FAF4E8" opacity="1"/><rect x="0" y="381" width="4" height="63" fill="#AD6D25" opacity="1"/><text x="16" y="406" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#AD6D25" text-anchor="start">第五章</text><text x="16" y="431" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#AD6D25" text-anchor="start">模型生态 GOSM</text><text x="263" y="419" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#13253D" text-anchor="start">模型供给、派生和数据接续</text><text x="677" y="419" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">许可、语言、质量与部署条件</text><path d="M0.000,470.000 L1000.000,470.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="496" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="502" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="33" y="503" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">第六章把证据组织为行动，并留下结果检验</text><rect x="0" y="523" width="314" height="5" fill="#155FA8" opacity="1"/><text x="0" y="557" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#155FA8" text-anchor="start">实施机构</text><text x="0" y="589" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">核算成本、开展本地测试</text><text x="0" y="620" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">服务覆盖、质量与实际支出</text><rect x="343" y="523" width="314" height="5" fill="#007D78" opacity="1"/><text x="343" y="557" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#007D78" text-anchor="start">社区与维护组织</text><text x="343" y="589" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">明确更新、响应与交接</text><text x="343" y="620" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">故障处置和持续维护记录</text><rect x="686" y="523" width="314" height="5" fill="#68509B" opacity="1"/><text x="686" y="557" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#68509B" text-anchor="start">资助与合作方</text><text x="686" y="589" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">支持共建、适配和能力培养</text><text x="686" y="620" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">合作成果与本地承接能力</text><path d="M0.000,639.000 L1000.000,639.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="665" r="12" fill="#68509B" stroke="#68509B" stroke-width="1.3"/><text x="12" y="671" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="672" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#13253D" text-anchor="start">附录 A 保留定义、时间窗、对象映射和复核方法</text></svg>