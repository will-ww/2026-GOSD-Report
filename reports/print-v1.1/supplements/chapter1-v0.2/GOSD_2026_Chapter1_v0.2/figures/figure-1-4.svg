<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="700" fill="#FFFFFF" opacity="1"/><circle cx="12" cy="20" r="12" fill="#155FA8" stroke="#155FA8" stroke-width="1.3"/><text x="12" y="26" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="33" y="27" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">共同的发展方向，落实为不同层次的问题</text><rect x="0" y="54" width="315" height="5" fill="#155FA8" opacity="1"/><text x="0" y="88" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#155FA8" text-anchor="start">SDGs · 17 个目标</text><text x="0" y="122" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#13253D" text-anchor="start">希望改善什么</text><text x="0" y="154" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">教育、健康、机会与可持续发展</text><rect x="342" y="54" width="315" height="5" fill="#007D78" opacity="1"/><text x="342" y="88" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#007D78" text-anchor="start">数字公共品（DPG）标准</text><text x="342" y="122" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#13253D" text-anchor="start">资源是否具备基本条件</text><text x="342" y="154" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">开放、可理解、可接续与不伤害</text><rect x="684" y="54" width="315" height="5" fill="#68509B" opacity="1"/><text x="684" y="88" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#68509B" text-anchor="start">AI 数字公共品研究 · 2026</text><text x="684" y="122" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#13253D" text-anchor="start">实施还需要什么</text><text x="684" y="154" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">本地能力、责任、算力与维护</text><path d="M0.000,176.000 L1000.000,176.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="204" r="12" fill="#007D78" stroke="#007D78" stroke-width="1.3"/><text x="12" y="210" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="33" y="211" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">开放资源成为公共能力，需要同时检验四类条件</text><path d="M310.000,291.000 L382.000,347.000" fill="none" stroke="#155FA8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><rect x="0" y="238" width="310" height="106" fill="#EEF4FA" opacity="1"/><rect x="0" y="238" width="4" height="106" fill="#155FA8" opacity="1"/><text x="17" y="269" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#155FA8" text-anchor="start">可获得</text><text x="17" y="301" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">代码、模型、数据能取得</text><text x="17" y="326" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">版本、许可与文档说得清</text><path d="M310.000,420.000 L382.000,347.000" fill="none" stroke="#007D78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><rect x="0" y="367" width="310" height="106" fill="#EDF6F5" opacity="1"/><rect x="0" y="367" width="4" height="106" fill="#007D78" opacity="1"/><text x="17" y="398" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#007D78" text-anchor="start">可复用</text><text x="17" y="430" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">算力与运行成本可承担</text><text x="17" y="455" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">语言、任务与环境可适配</text><path d="M690.000,291.000 L618.000,347.000" fill="none" stroke="#68509B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><rect x="690" y="238" width="310" height="106" fill="#F3F0F8" opacity="1"/><rect x="690" y="238" width="4" height="106" fill="#68509B" opacity="1"/><text x="707" y="269" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#68509B" text-anchor="start">可维护</text><text x="707" y="301" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">有人负责更新与故障处置</text><text x="707" y="326" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">资金、交接与响应可持续</text><path d="M690.000,420.000 L618.000,347.000" fill="none" stroke="#AD6D25" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><rect x="690" y="367" width="310" height="106" fill="#FAF4E8" opacity="1"/><rect x="690" y="367" width="4" height="106" fill="#AD6D25" opacity="1"/><text x="707" y="398" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#AD6D25" text-anchor="start">有成效</text><text x="707" y="430" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">服务解决真实的使用问题</text><text x="707" y="455" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">覆盖、质量与风险可验证</text><circle cx="500" cy="349" r="92" fill="#EEF4FA" stroke="#EEF4FA" stroke-width="1.3"/><text x="500" y="333" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" fill="#155FA8" text-anchor="middle">可持续</text><text x="500" y="373" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" fill="#155FA8" text-anchor="middle">公共能力</text><text x="500" y="496" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="middle">虚线表示需共同检验的条件关系，不表示已经证实的因果效应。</text><path d="M0.000,515.000 L1000.000,515.000" fill="none" stroke="#D9E3E9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="12" cy="541" r="12" fill="#68509B" stroke="#68509B" stroke-width="1.3"/><text x="12" y="547" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="33" y="548" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#13253D" text-anchor="start">DPG 的九项基本要求，为资源核对提供参照</text><text x="0" y="585" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">1  与 SDGs 相关</text><text x="0" y="616" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">2  开放许可</text><text x="0" y="647" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">3  权属明确</text><text x="342" y="585" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">4  平台独立性</text><text x="342" y="616" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">5  提供文档</text><text x="342" y="647" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">6  数据提取机制</text><text x="684" y="585" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">7  隐私与适用法律</text><text x="684" y="616" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">8  标准与最佳实践</text><text x="684" y="647" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#13253D" text-anchor="start">9  不伤害：安全、内容与反骚扰</text><text x="0" y="689" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" fill="#5C6B7A" text-anchor="start">DPG 认可针对核心方案设计；地方部署效果仍需另外验证。以上为中文概述。</text></svg>