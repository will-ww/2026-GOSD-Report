<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="166mm" height="147mm" viewBox="0 0 166 147"><text x="0" y="6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="4.2333333333333325" font-weight="700" text-anchor="start">许可条件阅读索引</text><text x="0" y="12" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="2.998611111111111" font-weight="400" text-anchor="start">选取与复用直接相关的条款；不是许可证优劣排名</text><path d="M0 18.0L166 18.0" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="24.0" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">MIT</text><text x="43" y="24.0" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">版权与许可声明</text><text x="43" y="30.0" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">软件复制件或实质部分须包含版权及许可声明。</text><path d="M0 37.4L166 37.4" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="43.4" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">BSD-3-Clause</text><text x="43" y="43.4" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">声明与不背书</text><text x="43" y="49.4" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">源码、二进制分发须保留相应声明；未经许可不得使用相关名称背书。</text><path d="M0 56.8L166 56.8" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62.8" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">Apache-2.0</text><text x="43" y="62.8" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">专利许可与分发条件</text><text x="43" y="68.8" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">明确专利许可；分发时保留许可、修改说明及适用的NOTICE内容。</text><path d="M0 76.19999999999999L166 76.19999999999999" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="82.19999999999999" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">GPL-3.0</text><text x="43" y="82.19999999999999" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">分发与对应源码</text><text x="43" y="88.19999999999999" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">分发受许可覆盖的作品时，依第5—6条处理许可及对应源码义务。</text><path d="M0 95.6L166 95.6" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="101.6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">AGPL-3.0</text><text x="43" y="101.6" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">修改后的网络交互</text><text x="43" y="107.6" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">修改版本供用户通过网络交互时，依第13条提供对应源码获取方式。</text><path d="M0 115.0L166 115.0" fill="none" stroke="#D7E4EA" stroke-width="0.28" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="121.0" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">MulanPSL-2.0</text><text x="43" y="121.0" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.598333333333333" font-weight="700" text-anchor="start">专利、声明与双语条款</text><text x="43" y="127.0" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.2455555555555553" font-weight="400" text-anchor="start">分发保留许可及相关声明；中英文同等效力，冲突时以中文版为准。</text><text x="0" y="146" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="2.822222222222222" font-weight="400" text-anchor="start">统计表的GPL／AGPL未分only与or-later；具体适用须核对完整条款、版本与材料。</text></svg>