<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="166mm" height="74mm" viewBox="0 0 166 74"><text x="0" y="6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="4.2333333333333325" font-weight="700" text-anchor="start">组织支持与项目自治：把责任落实到可查记录</text><text x="0" y="12" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="2.998611111111111" font-weight="400" text-anchor="start">Apache官方实践 · 责任分工示意，不作治理评分</text><rect x="0" y="17" width="166" height="15" rx="0.8" fill="#F2F5F9"/><rect x="0" y="17" width="1" height="15" rx="0" fill="#943B9A"/><text x="4" y="23" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.4572222222222226" font-weight="700" text-anchor="start">基金会</text><text x="47" y="22.6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.563055555555555" font-weight="700" text-anchor="start">法律、资产和共同服务</text><text x="47" y="29" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.210277777777778" font-weight="400" text-anchor="start">章程、机构决议、基础设施服务</text><rect x="0" y="34" width="166" height="15" rx="0.8" fill="#F2F5F9"/><rect x="0" y="34" width="1" height="15" rx="0" fill="#943B9A"/><text x="4" y="40" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.4572222222222226" font-weight="700" text-anchor="start">项目管理委员会</text><text x="47" y="39.6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.563055555555555" font-weight="700" text-anchor="start">项目方向、社区与发布</text><text x="47" y="46" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.210277777777778" font-weight="400" text-anchor="start">项目治理文件、讨论与发布投票</text><rect x="0" y="51" width="166" height="15" rx="0.8" fill="#F2F5F9"/><rect x="0" y="51" width="1" height="15" rx="0" fill="#943B9A"/><text x="4" y="57" fill="#943B9A" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.4572222222222226" font-weight="700" text-anchor="start">贡献者与提交者</text><text x="47" y="56.6" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.563055555555555" font-weight="700" text-anchor="start">代码、文档、审阅和维护</text><text x="47" y="63" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.210277777777778" font-weight="400" text-anchor="start">Issue、PR、邮件讨论、贡献指南</text><text x="0" y="73" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="2.9280555555555554" font-weight="400" text-anchor="start">共同服务不取代项目技术决定；公开讨论与发布记录提供责任核查入口。</text></svg>