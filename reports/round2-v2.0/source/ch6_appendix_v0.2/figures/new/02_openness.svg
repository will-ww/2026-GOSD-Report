<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="166mm" height="78mm" viewBox="0 0 166 78"><text x="0" y="5" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">870 个报告样本中的高开放组</text><text x="166" y="5" fill="#80682E" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="end">600 个模型</text><rect x="0" y="14" width="32.37" height="13" rx="0" fill="#267D4E"/><rect x="32.37" y="14" width="133.63" height="13" rx="0" fill="#E6E9E7"/><text x="16.185" y="23" fill="#FFFFFF" font-family="Liberation Sans, Noto Sans CJK SC" font-size="4.2333333333333325" font-weight="700" text-anchor="middle">117</text><text x="99.185" y="23" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="4.2333333333333325" font-weight="700" text-anchor="middle">483</text><text x="0" y="35" fill="#267D4E" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.175" font-weight="700" text-anchor="start">同时高完整</text><text x="166" y="35" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.175" font-weight="700" text-anchor="end">仍属低完整</text><text x="0" y="61" fill="#267D4E" font-family="Liberation Sans, Noto Sans CJK SC" font-size="11.288888888888888" font-weight="700" text-anchor="start">19.5%</text><text x="62" y="52" fill="#142C49" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.880555555555555" font-weight="700" text-anchor="start">高开放组中，同时高完整的比例</text><text x="62" y="62" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="3.3513888888888888" font-weight="400" text-anchor="start">117 / 600；其余 80.5% 仍属低完整。</text><text x="0" y="76" fill="#536B7D" font-family="Liberation Sans, Noto Sans CJK SC" font-size="2.9280555555555554" font-weight="400" text-anchor="start">高完整：L3–L5；高开放：O2–O4。沿用源评估，未重新授级。</text></svg>