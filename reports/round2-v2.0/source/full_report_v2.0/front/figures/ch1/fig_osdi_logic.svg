<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="166mm" height="70mm" viewBox="0 0 166 70"><text x="0" y="6" fill="#142C49" font-family="Noto Sans CJK SC" font-size="3.880555555555555" font-weight="700" text-anchor="start">把目标转化为可核对的观察信号</text><text x="0" y="29" fill="#007D78" font-family="Liberation Sans" font-size="8.819444444444445" font-weight="700" text-anchor="start">4</text><text x="20" y="23" fill="#142C49" font-family="Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">发展目标</text><text x="0" y="39" fill="#536B7D" font-family="Noto Sans CJK SC" font-size="3.175" font-weight="400" text-anchor="start">希望走向哪里？</text><path d="M0 44L50 44" fill="none" stroke="#D7E4EA" stroke-width="0.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="29" fill="#155FA8" font-family="Liberation Sans" font-size="8.819444444444445" font-weight="700" text-anchor="start">10</text><text x="76" y="23" fill="#142C49" font-family="Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">观察方向</text><text x="56" y="39" fill="#536B7D" font-family="Noto Sans CJK SC" font-size="3.175" font-weight="400" text-anchor="start">从哪些方面判断？</text><path d="M56 44L106 44" fill="none" stroke="#D7E4EA" stroke-width="0.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="29" fill="#6146A5" font-family="Liberation Sans" font-size="8.819444444444445" font-weight="700" text-anchor="start">29</text><text x="132" y="23" fill="#142C49" font-family="Noto Sans CJK SC" font-size="3.5277777777777777" font-weight="700" text-anchor="start">候选指标</text><text x="112" y="39" fill="#536B7D" font-family="Noto Sans CJK SC" font-size="3.175" font-weight="400" text-anchor="start">哪些数据能够核实？</text><path d="M112 44L162 44" fill="none" stroke="#D7E4EA" stroke-width="0.3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="53" fill="#142C49" font-family